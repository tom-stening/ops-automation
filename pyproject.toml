# Tool settings only: this repo is not an installable package. The scripts in
# scripts/ use the standard library alone and need Python 3.11 or newer.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S603", "S607",  # subprocess calls to git with fixed arguments
  "RUF001",        # en/em dashes in report text are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
