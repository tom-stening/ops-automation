# Keeps the actions used by the shared workflows up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week before proposing a new release, so a hijacked or broken
    # action version is usually caught upstream before it reaches every repo.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
