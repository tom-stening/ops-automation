name: Polyglot language assessment (shared)

# Reusable workflow. Profiles the caller's language mix and CPU-heavy Python
# functions, then opens the quarterly review issue (or comments on it if it
# is already open). Tailor the report with .github/polyglot-assessment.json in
# the calling repo; see scripts/polyglot_assess.py.

on:
  workflow_call:
    inputs:
      hot-path-dir:
        description: "Package directory to scan for CPU-heavy functions, relative to the repo root"
        type: string
        default: "."
      config-file:
        description: "JSON config, relative to the repo root (default: .github/polyglot-assessment.json if present)"
        type: string
        default: ""
      ops-ref:
        description: "Branch, tag or SHA of ops-automation whose scripts to run. Leave empty to use the same commit as this workflow (the ref after @ in your 'uses:' line)."
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"
      open-issue:
        description: "Open or update the quarterly issue. When false, the report only goes to the job summary."
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: tom-stening/ops-automation
          # Same commit as this workflow file, so @v1 callers get v1 scripts.
          ref: ${{ inputs.ops-ref || github.job_workflow_sha || 'main' }}
          path: .ops-automation
          persist-credentials: false

      - name: Show ops-automation version
        env:
          REQUESTED: ${{ inputs.ops-ref }}
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          echo "ops-ref input: ${REQUESTED:-<empty>}; workflow sha: ${WORKFLOW_SHA:-<empty>}"
          echo "scripts at: $(git -C .ops-automation rev-parse HEAD)"
          if [ -z "$REQUESTED" ] && [ -z "$WORKFLOW_SHA" ]; then
            echo "::warning::Could not tell which ops-automation commit this workflow came from; using main's scripts. Set ops-ref to pin them."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run assessment
        env:
          OPS_REPO_ROOT: ${{ github.workspace }}
          OPS_HOT_PATH_DIR: ${{ inputs.hot-path-dir }}
          OPS_POLYGLOT_CONFIG: ${{ inputs.config-file }}
        run: |
          python .ops-automation/scripts/polyglot_assess.py --out "$RUNNER_TEMP/assessment.md"
          cat "$RUNNER_TEMP/assessment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the quarterly issue
        if: inputs.open-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          M=$(date -u +%-m); Q="Q$(( (M + 2) / 3 ))"
          TITLE="Polyglot Assessment: ${Q} $(date -u +%Y)"
          EXISTING=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/assessment.md"
            echo "Commented on #$EXISTING."
            exit 0
          fi
          gh label create polyglot-assessment --color 1D76DB \
            --description "Quarterly language assessment" 2>/dev/null || true
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/assessment.md" --label polyglot-assessment \
            || gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/assessment.md"
