name: Triage CI-failure emails (shared)

# Reusable workflow. Moves CI-failure .msg files in the caller's
# emails/git_issues/ folders from unresolved/ to in_progress/ and records each
# failing workflow in the caller's docs/KNOWN_ISSUES.md, then commits the
# result back to the branch that triggered the run. See examples/ops.yml.

on:
  workflow_call:
    inputs:
      ops-ref:
        description: "Branch, tag or SHA of ops-automation whose scripts to run. Leave empty to use the same commit as this workflow (the ref after @ in your 'uses:' line)."
        type: string
        default: ""
      python-version:
        description: "Python used to run the script (3.11 or newer)"
        type: string
        default: "3.12"
    outputs:
      changed:
        description: "'true' when triage committed a change"
        value: ${{ jobs.triage.outputs.changed }}

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One triage at a time per repo and branch, so two runs can't race to push.
    concurrency:
      group: ops-triage-emails-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Checkout ops-automation scripts
        uses: actions/checkout@v4
        with:
          repository: tom-stening/ops-automation
          # Same commit as this workflow file, so @v1 callers get v1 scripts.
          ref: ${{ inputs.ops-ref || github.job_workflow_sha || 'main' }}
          path: .ops-automation
          persist-credentials: false

      - name: Show ops-automation version
        env:
          REQUESTED: ${{ inputs.ops-ref }}
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          echo "ops-ref input: ${REQUESTED:-<empty>}; workflow sha: ${WORKFLOW_SHA:-<empty>}"
          echo "scripts at: $(git -C .ops-automation rev-parse HEAD)"
          if [ -z "$REQUESTED" ] && [ -z "$WORKFLOW_SHA" ]; then
            echo "::warning::Could not tell which ops-automation commit this workflow came from; using main's scripts. Set ops-ref to pin them."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run email triage
        env:
          OPS_REPO_ROOT: ${{ github.workspace }}
        run: python .ops-automation/scripts/triage_emails.py

      - name: Commit triage results
        id: commit
        run: |
          rm -rf .ops-automation
          if [ -z "$(git status --porcelain -- docs/KNOWN_ISSUES.md emails/git_issues)" ]; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/KNOWN_ISSUES.md emails/git_issues
          git commit -m "chore(triage): process email triage [skip ci]"
          # Another commit may have landed since checkout: rebase and retry.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on the latest ${GITHUB_REF_NAME}."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push triage results after 3 attempts."
          exit 1
