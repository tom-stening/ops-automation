name: Maintenance checklist issue (shared)

# Reusable workflow. Opens this period's maintenance checklist issue (weekly,
# monthly or quarterly) from the cadence document, so the routine in
# docs/MAINTENANCE_CADENCE.md turns into a to-do list in each repo. If an
# issue with the same title already exists (open or closed) nothing happens,
# so re-runs are safe.

on:
  workflow_call:
    inputs:
      cadence:
        description: "weekly, monthly or quarterly"
        type: string
        required: true
      cadence-file:
        description: "Cadence document in the calling repo, relative to its root. Default: the shared docs/MAINTENANCE_CADENCE.md in ops-automation."
        type: string
        default: ""
      labels:
        description: "Comma-separated labels for the issue (created if missing)"
        type: string
        default: "maintenance"
      assignee:
        description: "GitHub login to assign the issue to (optional)"
        type: string
        default: ""
      ops-ref:
        description: "Branch, tag or SHA of ops-automation whose scripts to run. Leave empty to use the same commit as this workflow (the ref after @ in your 'uses:' line)."
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"
    outputs:
      issue-url:
        description: "URL of the issue opened, or of the existing one"
        value: ${{ jobs.open.outputs.issue-url }}

permissions:
  contents: read
  issues: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue-url: ${{ steps.issue.outputs.url }}
    steps:
      - name: Checkout calling repo
        if: inputs.cadence-file != ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.cadence-file }}
          sparse-checkout-cone-mode: false

      - name: Checkout ops-automation scripts
        uses: actions/checkout@v4
        with:
          repository: tom-stening/ops-automation
          # Same commit as this workflow file, so @v1 callers get v1 scripts.
          ref: ${{ inputs.ops-ref || github.job_workflow_sha || 'main' }}
          path: .ops-automation
          persist-credentials: false

      - name: Show ops-automation version
        env:
          REQUESTED: ${{ inputs.ops-ref }}
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          echo "ops-ref input: ${REQUESTED:-<empty>}; workflow sha: ${WORKFLOW_SHA:-<empty>}"
          echo "scripts at: $(git -C .ops-automation rev-parse HEAD)"
          if [ -z "$REQUESTED" ] && [ -z "$WORKFLOW_SHA" ]; then
            echo "::warning::Could not tell which ops-automation commit this workflow came from; using main's scripts. Set ops-ref to pin them."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Render checklist
        env:
          CADENCE: ${{ inputs.cadence }}
          CADENCE_FILE: ${{ inputs.cadence-file }}
        run: |
          args=("$CADENCE")
          if [ -n "$CADENCE_FILE" ]; then args+=(--cadence-file "$CADENCE_FILE"); fi
          python .ops-automation/scripts/maintenance_issue.py "${args[@]}" > "$RUNNER_TEMP/issue.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); open(sys.argv[2],"w").write(d["body"]); open(sys.argv[3],"w").write(d["title"])' \
            "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/title.txt"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open the issue unless it exists
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABELS: ${{ inputs.labels }}
          ASSIGNEE: ${{ inputs.assignee }}
        run: |
          TITLE=$(cat "$RUNNER_TEMP/title.txt")
          EXISTING=$(gh issue list --state all --limit 20 --search "\"${TITLE}\" in:title" --json title,url \
            | python -c 'import json,sys; t=sys.argv[1]; print(next((i["url"] for i in json.load(sys.stdin) if i["title"]==t), ""))' "$TITLE")
          if [ -n "$EXISTING" ]; then
            echo "Already exists: $EXISTING"
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
          IFS=',' read -ra label_list <<< "$LABELS"
          for label in "${label_list[@]}"; do
            label=$(echo "$label" | xargs)
            [ -z "$label" ] && continue
            gh label create "$label" --color FBCA04 2>/dev/null || true
            args+=(--label "$label")
          done
          if [ -n "$ASSIGNEE" ]; then args+=(--assignee "$ASSIGNEE"); fi
          URL=$(gh issue create "${args[@]}")
          echo "Opened $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
