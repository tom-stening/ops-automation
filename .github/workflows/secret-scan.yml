name: Secret scan (shared)

# Reusable workflow. Scans the calling repo's git history with gitleaks for
# committed credentials (API keys, tokens, private keys) and fails if any are
# found. Run it on every push and pull request, especially in public repos.
# Findings are redacted in the log; the job summary lists file, line, rule
# and commit so the secret can be rotated and removed.
#
# False positives: add a .gitleaksignore file (one finding fingerprint per
# line) or a .gitleaks.toml allowlist to the calling repo.

on:
  workflow_call:
    inputs:
      full-history:
        description: "Scan every commit (true) or only the commits in this push/PR (false)"
        type: boolean
        default: false
      gitleaks-version:
        description: "gitleaks release to use. Changing it also needs gitleaks-sha256."
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: "SHA-256 of gitleaks_<version>_linux_x64.tar.gz"
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Work out which commits to scan
        id: range
        env:
          FULL: ${{ inputs.full-history }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=""
          if [ "$FULL" != "true" ]; then
            if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
              range="${PR_BASE}..${PR_HEAD}"
            elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] \
                 && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          fi
          echo "Scanning: ${range:-full history}"
          echo "log-opts=${range}" >> "$GITHUB_OUTPUT"

      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: |
          args=(git --redact --no-banner --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json")
          if [ -n "$LOG_OPTS" ]; then args+=(--log-opts "$LOG_OPTS"); fi
          set +e
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/gitleaks.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              findings = json.load(open(sys.argv[1])) or []
          except (OSError, ValueError):
              findings = []
          print("## Secret scan\n")
          if not findings:
              print("No secrets found.")
              sys.exit(0)
          print(f"**{len(findings)} possible secret(s) found.** Rotate each one first, then remove it from the code.\n")
          print("| File | Line | Rule | Commit | Fingerprint |")
          print("|---|---:|---|---|---|")
          for f in findings:
              print(f"| `{f.get('File')}` | {f.get('StartLine')} | {f.get('RuleID')} | "
                    f"{str(f.get('Commit', ''))[:7]} | `{f.get('Fingerprint')}` |")
          PY
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks found possible secrets. See the job summary."
          fi
          exit "$status"
