# Copy to .github/workflows/secret-scan.yml in any repo. Checks each push and
# pull request for committed credentials, plus a full-history scan weekly.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * 6"   # Sun 06:00 AEST: full history
  workflow_dispatch:

jobs:
  gitleaks:
    uses: tom-stening/ops-automation/.github/workflows/secret-scan.yml@main
    with:
      full-history: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
