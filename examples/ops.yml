# Copy to .github/workflows/ops.yml in any repo to use the shared ops workflows.
# Delete the jobs you don't need. Schedules are in UTC; AEST is UTC+10.
#
# To pin a release instead of main, change every "@main" below to the tag
# (e.g. "@v1") and add "ops-ref: v1" under "with:" so the scripts match.
name: Ops

on:
  schedule:
    - cron: "0 * * * *"         # hourly: email triage
    - cron: "0 21 * * 0"        # weekly (Mon 07:00 AEST): dependency audit
    - cron: "0 22 1 * *"        # monthly (2nd, 08:00 AEST): maintenance checklist
    - cron: "0 9 1 1,4,7,10 *"  # quarterly: polyglot assessment + quarterly checklist
  push:
    paths:
      - "emails/git_issues/unresolved/**"
  workflow_dispatch:

jobs:
  triage-emails:
    if: github.event_name != 'schedule' || github.event.schedule == '0 * * * *'
    uses: tom-stening/ops-automation/.github/workflows/triage-emails.yml@main
    permissions:
      contents: write

  dependency-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 0'
    uses: tom-stening/ops-automation/.github/workflows/dependency-audit.yml@main
    # with:
    #   install-command: pip install -e ".[dev]"
    #   ignore-vulns: GHSA-xxxx-xxxx-xxxx   # record why in KNOWN_ISSUES
    permissions:
      contents: read

  polyglot-assessment:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 1 1,4,7,10 *'
    uses: tom-stening/ops-automation/.github/workflows/polyglot-assessment.yml@main
    with:
      hot-path-dir: ruleset   # your main package folder
    permissions:
      contents: read
      issues: write

  monthly-checklist:
    if: github.event.schedule == '0 22 1 * *'
    uses: tom-stening/ops-automation/.github/workflows/maintenance-reminder.yml@main
    with:
      cadence: monthly
    permissions:
      contents: read
      issues: write

  quarterly-checklist:
    if: github.event.schedule == '0 9 1 1,4,7,10 *'
    uses: tom-stening/ops-automation/.github/workflows/maintenance-reminder.yml@main
    with:
      cadence: quarterly
    permissions:
      contents: read
      issues: write
